name: jmcomic_mobile
description: JMComic 移动端漫画下载与阅读工具
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.0

  # 路由
  go_router: ^14.0.0

  # 网络
  dio: ^5.4.0
  http: ^1.2.0

  # 加密
  crypto: ^3.0.3
  pointycastle: ^3.9.0

  # 文件与路径
  path_provider: ^2.1.0
  path: ^1.9.0

  # 图片
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.0
  photo_view: ^0.15.0
  image: ^4.2.0

  # UI 组件
  shimmer: ^3.0.0

  # 工具
  uuid: ^4.3.0
  intl: ^0.19.0
  logger: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
